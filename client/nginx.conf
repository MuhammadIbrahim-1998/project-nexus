server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Static assets (Vite emits hashed filenames — cache aggressively)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router SPA fallback: kisi bhi route par index.html serve karo
    # (/, /jobs, /agents, /analytics — page refresh par 404 nahi aayega)
    location / {
        try_files $uri $uri/ /index.html;
    }
}